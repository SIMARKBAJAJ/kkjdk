<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Door</title>
  <meta name="theme-color" content="#1d1530">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
<main id="stage" data-state="loading">

  <section id="scene" aria-live="polite">
    <div class="stars" aria-hidden="true"></div>
    <div class="frame">
      <div class="glow" aria-hidden="true"></div>
      <div class="doorway" aria-hidden="true"></div>
      <button id="door" class="door" type="button" aria-label="Knock on the door">
        <span class="panel p1"></span><span class="panel p2"></span>
        <span class="panel p3"></span><span class="panel p4"></span>
        <span class="knob"></span>
      </button>
    </div>
    <h1 id="headline">The Door</h1>
    <p id="caption"></p>
    <button id="notify-btn" class="soft" type="button" hidden>Allow knocks on this device</button>
    <p id="hint" hidden></p>
  </section>

  <section id="call" hidden>
    <video id="remote" playsinline autoplay></video>
    <video id="local" playsinline autoplay muted></video>
    <div id="live" class="live" aria-label="Your camera is live"><i></i>LIVE</div>
    <p id="call-status"></p>
    <div id="controls">
      <button id="mic" class="ctl" type="button" aria-label="Mute microphone" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>
      </button>
      <button id="cam" class="ctl" type="button" aria-label="Turn camera off" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
      </button>
      <button id="flip" class="ctl" type="button" aria-label="Switch camera" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/></svg>
      </button>
      <button id="share" class="ctl" type="button" aria-label="Share screen" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      </button>
      <button id="hangup" class="ctl end" type="button" aria-label="Close the door">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
      </button>
    </div>
  </section>

</main>
<script src="/vendor/livekit-client.umd.js"></script>
<script src="/app.js"></script>
</body>
</html>
